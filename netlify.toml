[build.environment]
  # The Supabase anon key is a public, client-side key protected by Row Level
  # Security — it is intentionally embedded in the browser bundle (NEXT_PUBLIC_*).
  # Exclude it from secret scanning so it doesn't fail the build.
  # The real secret (SUPABASE_SERVICE_ROLE_KEY) is server-only and stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY"
